name: Paper-trading tick

# Re-touched to re-register the cron schedule with GitHub's scheduler
# (schedule triggers sometimes don't activate until the workflow file
# gets a fresh push after creation).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-trading-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python scheduler.py --once

      - name: Commit updated ledgers
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data_store/
          if git diff --cached --quiet; then
            echo "no ledger changes this tick"
            exit 0
          fi
          git commit -m "tick: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # main may have moved since checkout (e.g. a manual push landed while
          # this run was installing deps / fetching data) -- retry with rebase
          # instead of letting the whole tick's data get dropped on a bare push failure.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), fetching and rebasing"
            git fetch origin main
            git rebase origin/main
          done
          echo "push failed after 5 attempts" >&2
          exit 1
